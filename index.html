<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Vault · 网站设计风格收藏册</title>
  <style>
    :root{--tk-bg:#fff;--tk-surface:#f6f9fc;--tk-text:#0a2540;--tk-muted:#425466;--tk-accent:#635bff;--tk-border:#e6ebf1;--tk-font-sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--tk-font-display:var(--tk-font-sans);--tk-radius:10px;--tk-shadow:0 2px 8px rgba(10,37,64,.08);--tk-space:8px;--tk-btn-radius:8px;--tk-btn-border:transparent;--tk-btn-shadow:0 2px 8px rgba(10,37,64,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--tk-bg);color:var(--tk-text);font:15px/1.55 var(--tk-font-sans);transition:background .25s,color .25s} button{font:inherit} .shell{max-width:1180px;margin:auto;padding:32px 24px 80px}.eyebrow{color:var(--tk-accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.top{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid var(--tk-border);padding-bottom:26px}.top h1{font:700 clamp(28px,5vw,52px)/1 var(--tk-font-display);margin:8px 0}.top p{margin:0;color:var(--tk-muted);max-width:510px}.status{font-size:13px;color:var(--tk-muted);white-space:nowrap}.section{margin-top:46px}.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}.section-title h2{font:700 20px/1.2 var(--tk-font-display);margin:0}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.site-card{padding:0;border:1px solid var(--tk-border);border-radius:var(--tk-radius);background:var(--tk-bg);color:var(--tk-text);text-align:left;cursor:pointer;overflow:hidden;box-shadow:none;transition:transform .18s,box-shadow .18s,border-color .18s}.site-card:hover,.site-card[aria-pressed=true]{transform:translateY(-3px);border-color:var(--tk-accent);box-shadow:var(--tk-shadow)}.cover{height:136px;background:var(--card-surface,#f6f9fc);padding:15px;position:relative;overflow:hidden}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.mini{height:100%;border-radius:8px;background:var(--card-bg,#fff);padding:10px;display:grid;gap:8px}.mini-top{height:7px;width:44%;background:var(--card-text,#0a2540);border-radius:9px}.mini-hero{width:78%;height:34px;background:var(--card-text,#0a2540);opacity:.86;border-radius:5px}.mini-cta{width:48px;height:16px;background:var(--card-accent,#635bff);border-radius:4px}.card-meta{padding:13px 14px;display:flex;gap:9px;align-items:center}.dot{width:10px;height:10px;border-radius:99px;background:var(--card-accent,var(--tk-accent));flex:none}.card-meta strong{display:block}.card-meta span{font-size:12px;color:var(--tk-muted)}.warn{margin-left:auto;color:#9a5600;font-size:11px;font-weight:700}.detail{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;padding:clamp(22px,5vw,52px);background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:calc(var(--tk-radius) * 1.6);box-shadow:var(--tk-shadow)}.detail h2{font:700 clamp(30px,5vw,54px)/1 var(--tk-font-display);margin:10px 0}.detail p{color:var(--tk-muted);margin:14px 0 0;max-width:650px}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{border:1px solid var(--tk-border);border-radius:99px;padding:3px 9px;font-size:12px;background:var(--tk-bg)}.facts{border-left:1px solid var(--tk-border);padding-left:22px;color:var(--tk-muted);font-size:13px}.facts a{color:var(--tk-accent)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.panel{border:1px solid var(--tk-border);border-radius:var(--tk-radius);padding:18px;background:var(--tk-bg)}.panel h3{font-size:13px;margin:0 0 13px}.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.swatch{border:1px solid var(--tk-border);padding:8px;border-radius:calc(var(--tk-radius) * .8);background:var(--tk-bg);color:var(--tk-text);text-align:left;cursor:pointer}.chip{height:46px;border-radius:calc(var(--tk-radius) * .55);margin-bottom:7px;border:1px solid rgba(0,0,0,.08)}.swatch b,.swatch small{display:block}.swatch small{color:var(--tk-muted);font-size:11px}.type-row{padding:12px 0;border-bottom:1px solid var(--tk-border)}.type-row:last-child{border:0}.type-row small{display:block;color:var(--tk-muted);font-family:var(--tk-font-sans);font-size:11px}.space-row{display:flex;align-items:center;gap:10px;margin:11px 0;font-size:12px}.space-bar{height:10px;background:var(--tk-accent);border-radius:99px}.radius-samples{display:flex;align-items:end;gap:10px}.radius-box{width:52px;height:52px;background:var(--tk-accent)}.shadow-box{height:86px;border-radius:var(--tk-radius);background:var(--tk-bg);box-shadow:var(--tk-shadow);display:grid;place-items:center;color:var(--tk-muted);font-size:12px}.live{display:flex;align-items:center;gap:11px;flex-wrap:wrap}.button{border:1px solid var(--tk-btn-border);border-radius:var(--tk-btn-radius);padding:9px 13px;background:var(--tk-accent);color:#fff;box-shadow:var(--tk-btn-shadow);cursor:pointer}.button.secondary{background:var(--tk-bg);color:var(--tk-text);border-color:var(--tk-border);box-shadow:none}.mini-card{padding:14px;border:1px solid var(--tk-border);border-radius:var(--tk-radius);min-width:170px}.mini-card strong,.mini-card span{display:block}.mini-card span{color:var(--tk-muted);font-size:12px}.code{padding:0;overflow:hidden}.tabs{display:flex;overflow:auto;border-bottom:1px solid var(--tk-border)}.tab{border:0;background:transparent;padding:12px 14px;color:var(--tk-muted);cursor:pointer;white-space:nowrap}.tab[aria-selected=true]{color:var(--tk-accent);box-shadow:inset 0 -2px var(--tk-accent);font-weight:700}.code-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px 0}.copy{border:1px solid var(--tk-border);background:var(--tk-bg);color:var(--tk-text);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:12px}.code pre{margin:0;padding:16px;max-height:420px;overflow:auto;background:color-mix(in srgb,var(--tk-surface) 72%,var(--tk-bg));font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.empty{border:1px dashed var(--tk-border);padding:28px;border-radius:var(--tk-radius);color:var(--tk-muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--tk-text);color:var(--tk-bg);padding:8px 12px;border-radius:99px;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.top,.detail{display:block}.status{margin-top:16px}.facts{border-left:0;border-top:1px solid var(--tk-border);padding:14px 0 0;margin-top:20px}.grid{grid-template-columns:1fr}.shell{padding:24px 16px 56px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><div class="eyebrow">Local style archive</div><h1>Vibe Vault</h1><p>把网站的可迁移视觉原子收进一本可换肤、可复制的收藏册。</p></div><div class="status" id="status">正在载入收藏…</div></header>
    <section class="section"><div class="section-title"><h2>风格画廊</h2><span id="count"></span></div><div class="gallery" id="gallery"></div></section>
    <section class="section" id="detail" hidden>
      <div class="detail"><div><div class="eyebrow" id="current-style"></div><h2 id="current-name"></h2><div class="tags" id="tags"></div><p id="thesis"></p></div><div class="facts" id="facts"></div></div>
      <div class="section-title"><h2>稳定色</h2><span>点击色卡复制 HEX</span></div><div class="swatches" id="swatches"></div>
      <div class="section-title section"><h2>字体与节奏</h2><span id="font-stack"></span></div><div class="grid"><article class="panel"><h3>字阶</h3><div id="type-scale"></div></article><article class="panel"><h3>间距 · <span id="density"></span></h3><div id="spaces"></div></article><article class="panel"><h3>圆角 / 阴影</h3><div class="radius-samples" id="radii"></div><div class="shadow-box" id="shadow">轻量层次</div></article></div>
      <div class="section-title section"><h2>活预览</h2><span>由当前主题变量实时渲染</span></div><article class="panel"><div class="live"><button class="button">开始使用</button><button class="button secondary">了解更多</button><div class="mini-card"><strong>清晰而克制</strong><span>用 token，而不是复刻布局。</span></div></div></article>
      <div class="section-title section"><h2>代码查看器</h2><span>查看后再复制</span></div><article class="panel code"><div class="tabs" id="tabs"></div><div class="code-head"><strong id="code-label"></strong><button class="copy" id="copy-code">复制当前内容</button></div><pre id="code"></pre></article>
    </section>
  </main><div class="toast" id="toast" role="status"></div>
  <script>
    (() => {
      const $ = s => document.querySelector(s), state = {sites:[],current:null,guide:'',tab:'guide'};
      const defaults = {'--tk-bg':'#fff','--tk-surface':'#f6f9fc','--tk-text':'#0a2540','--tk-muted':'#425466','--tk-accent':'#635bff','--tk-border':'#e6ebf1','--tk-font-sans':'Inter, sans-serif','--tk-font-display':'Inter, sans-serif','--tk-radius':'10px','--tk-shadow':'0 2px 8px rgba(10,37,64,.08)','--tk-space':'8px','--tk-btn-radius':'8px','--tk-btn-border':'transparent','--tk-btn-shadow':'0 2px 8px rgba(10,37,64,.08)'};
      const esc = v => String(v ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const toast = text => { const n=$('#toast'); n.textContent=text; n.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>n.classList.remove('show'),1500); };
      async function copy(text){ try { await navigator.clipboard.writeText(text); } catch { const a=document.createElement('textarea'); a.value=text; a.style.cssText='position:fixed;opacity:0'; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); } toast('已复制'); }
      const role = (colors, word) => (colors||[]).find(c => c.role.toLowerCase().includes(word));
      function cssVars(s){ return ':root {\n' + Object.entries(s.theme||{}).map(([k,v])=>`  ${k}: ${v};`).join('\n') + '\n}'; }
      function tailwind(s){ const t=s.tokens||{}, c=t.colors||[]; const named=['bg','surface','text','muted','accent','border'].reduce((o,k)=>{const x=role(c,k);if(x)o[k]=x.hex;return o;},{}); return `/** tailwind.config.js */\nexport default {\n  theme: {\n    extend: {\n      colors: ${JSON.stringify(named,null,8)},\n      fontFamily: { sans: [${JSON.stringify(t.typography?.fontSans||'sans-serif')}] },\n      borderRadius: { DEFAULT: '${t.radius?.md??10}px' },\n      boxShadow: { DEFAULT: ${JSON.stringify(t.shadow?.md||'none')} }\n    }\n  }\n}`; }
      function guide(s){ const t=s.tokens||{}, c=t.colors||[], get=k=>role(c,k)?.hex||'未采集'; return `# STYLE-GUIDE · ${s.name}\n\n## 风格定调\n\n主风格：${s.style?.primary||'未判定'}${s.style?.secondary?' · 次风格：'+s.style.secondary:''}\n气质词：${(s.style?.descriptors||[]).join(' / ')}\n\n${s.style?.thesis||'请以稳定 token 为准，保持信息优先。'}\n\n## 主题色（只保留 L1/L2 稳定色）\n\n- 使用背景 ${get('bg')}、分隔面 ${get('surface')}、正文 ${get('text')}、次要 ${get('muted')}。\n- 只把强调色 ${get('accent')} 用在 CTA 与关键数据；避免大面积铺满。\n\n## 字体\n\n- 使用 ${t.typography?.fontSans||'系统字体栈'}。\n- 保持 ${t.typography?.contrast||'清晰'} 的标题与正文对比。\n\n## 间距 / 密度\n\n- 以 ${t.space?.unit??8}px 为基准，保持 ${t.space?.density||'稳定'} 的节奏。\n\n## 圆角 / 阴影\n\n- 使用约 ${t.radius?.md??10}px 的${t.radius?.tendency||'一致'}圆角。\n- 阴影保持${t.shadow?.weight||'轻'}：${t.shadow?.md||'无'}。`; }
      function outputs(){const s=state.current; return {guide:state.guide||guide(s),css:cssVars(s),tailwind:tailwind(s),json:JSON.stringify(s.tokens||{},null,2)};}
      function renderCode(){const o=outputs(), labels={guide:'STYLE-GUIDE.md',css:'CSS 变量',tailwind:'Tailwind',json:'tokens.json'}; $('#tabs').innerHTML=Object.entries(labels).map(([k,v])=>`<button class="tab" data-tab="${k}" aria-selected="${state.tab===k}">${v}</button>`).join(''); $('#code-label').textContent=labels[state.tab]; $('#code').textContent=o[state.tab];}
      function renderGallery(){ $('#gallery').innerHTML=state.sites.map(s=>{const a=role(s.tokens?.colors,'accent')?.hex||s.theme?.['--tk-accent']||'#635bff', bg=s.theme?.['--tk-bg']||'#fff', su=s.theme?.['--tk-surface']||'#f6f9fc', tx=s.theme?.['--tk-text']||'#102a43'; const shot=s.screenshot?`sites/${encodeURIComponent(s.id)}/${encodeURIComponent(s.screenshot)}`:''; return `<button class="site-card" data-id="${esc(s.id)}" aria-pressed="${s.id===state.current?.id}"><div class="cover" style="--card-accent:${esc(a)};--card-bg:${esc(bg)};--card-surface:${esc(su)};--card-text:${esc(tx)}">${shot?`<img src="${shot}" alt="${esc(s.name)} 首屏截图" onerror="this.remove()">`:''}<div class="mini"><i class="mini-top"></i><i class="mini-hero"></i><i class="mini-cta"></i></div></div><div class="card-meta"><i class="dot"></i><div><strong>${esc(s.name)}</strong><span>${esc(s.style?.primary||'未判定')}</span></div>${s.warnings?.length?'<span class="warn" title="'+esc(s.warnings.join('；'))+'">部分抽取</span>':''}</div></button>`; }).join(''); }
      function renderDetail(){const s=state.current,t=s.tokens||{},ty=t.typography||{},ra=t.radius||{},sp=t.space||{},sh=t.shadow||{}; $('#detail').hidden=false; $('#current-name').textContent=s.name; $('#current-style').textContent=[s.style?.primary,s.style?.secondary].filter(Boolean).join(' · ')||'未判定'; $('#thesis').textContent=s.style?.thesis||'此记录未提供风格说明。'; $('#tags').innerHTML=(s.style?.descriptors||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join(''); $('#facts').innerHTML=`采集于 ${esc(s.extractedAt||'未知')}<br><a href="${esc(s.url||'#')}" target="_blank" rel="noreferrer">访问原站 ↗</a>${s.warnings?.length?'<br><br><strong>部分抽取</strong><br>'+s.warnings.map(esc).join('<br>'):''}`; $('#swatches').innerHTML=(t.colors||[]).map(c=>`<button class="swatch" data-copy="${esc(c.hex)}"><i class="chip" style="background:${esc(c.hex)}"></i><b>${esc(c.role)}</b><small>${esc(c.hex)} · ${esc(c.stability||'')}</small></button>`).join('')||'<p class="empty">没有可用的稳定色 token。</p>'; $('#font-stack').textContent=ty.fontSans||'未采集字体栈'; $('#type-scale').innerHTML=(ty.scale||[]).map(x=>`<div class="type-row" style="font-size:${Number(x.px)||16}px;font-weight:${Number(x.w)||400};line-height:${Number(x.lh)||1.4}">${esc(x.role||'文字')}<small>${Number(x.px)||16}px / ${Number(x.w)||400} / ${Number(x.lh)||1.4}</small></div>`).join('')||'<span class="empty">没有字阶数据。</span>'; $('#density').textContent=sp.density||'未采集'; $('#spaces').innerHTML=(sp.scale||[]).map(x=>`<div class="space-row"><span>${esc(x)}px</span><i class="space-bar" style="width:${Math.min(Number(x)*2,160)||16}px"></i></div>`).join('')||'<span class="empty">没有间距数据。</span>'; $('#radii').innerHTML=[['sm',ra.sm],['md',ra.md],['lg',ra.lg]].filter(([,v])=>v!=null).map(([k,v])=>`<div><i class="radius-box" style="border-radius:${Number(v)}px"></i><small>${k} ${esc(v)}px</small></div>`).join('')||'<span class="empty">没有圆角数据。</span>'; $('#shadow').style.boxShadow=sh.md||'none'; renderCode(); }
      async function select(id){const s=state.sites.find(x=>x.id===id);if(!s)return; state.current=s; Object.entries({...defaults,...(s.theme||{})}).forEach(([k,v])=>document.documentElement.style.setProperty(k,v)); try{const res=await fetch(`sites/${encodeURIComponent(s.id)}/STYLE-GUIDE.md`); state.guide=res.ok?await res.text():'';}catch{state.guide='';} renderGallery(); renderDetail(); }
      document.addEventListener('click',e=>{const card=e.target.closest('.site-card'), swatch=e.target.closest('[data-copy]'), tab=e.target.closest('[data-tab]'); if(card)select(card.dataset.id); if(swatch)copy(swatch.dataset.copy); if(tab){state.tab=tab.dataset.tab;renderCode();} if(e.target.closest('#copy-code'))copy(outputs()[state.tab]);});
      async function boot(){try{const idx=await (await fetch('sites/index.json')).json(); const loaded=await Promise.all(idx.map(async i=>{try{return await (await fetch(`sites/${encodeURIComponent(i.id)}/site.json`)).json();}catch{return {...i,warnings:['站点记录无法加载']};}})); state.sites=loaded; $('#count').textContent=`${loaded.length} 个已收藏网站`; if(!loaded.length)throw new Error('索引中没有记录'); await select(loaded[0].id); $('#status').textContent='本地静态收藏册';}catch(err){$('#status').textContent='加载失败'; $('#gallery').innerHTML=`<div class="empty">无法加载 sites/index.json。请通过静态 HTTP 服务器打开此页面，而不是 file://。<br><small>${esc(err.message)}</small></div>`;}}
      boot();
    })();
  </script>
</body>
</html>
