    *{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:var(--tk-bg);color:var(--tk-text);font:15px/1.55 var(--tk-font-sans);transition:background-color var(--motion-content) var(--ease-out),color var(--motion-content) var(--ease-out)}button{font:inherit}.shell{max-width:1180px;margin:auto;padding:32px 24px 80px}.eyebrow{color:var(--tk-accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.top{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid var(--tk-border);padding-bottom:26px}.top h1{font:700 clamp(28px,5vw,52px)/1 var(--tk-font-display);margin:8px 0}.top p{margin:0;color:var(--tk-muted);max-width:510px}.status{font-size:13px;color:var(--tk-muted);white-space:nowrap}.section{margin-top:var(--section-gap)}.section-title{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:var(--title-gap)}.section-title h2{font:700 20px/1.2 var(--tk-font-display);margin:0}.site-card{padding:0;border:1px solid var(--tk-border);border-radius:var(--tk-radius);background:var(--tk-bg);color:var(--tk-text);text-align:left;cursor:pointer;overflow:hidden;box-shadow:none;transition:transform var(--motion-press) var(--ease-out),border-color var(--motion-content) var(--ease-out)}.site-card[aria-pressed=true]{border-color:var(--tk-accent)}.site-card:active{transform:scale(.985)}.detail{display:grid;grid-template-columns:1.2fr .8fr;gap:var(--panel-gap);padding:clamp(22px,5vw,52px);background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:calc(var(--tk-radius) * 1.6);transition:background-color var(--motion-content) var(--ease-out),color var(--motion-content) var(--ease-out),border-color var(--motion-content) var(--ease-out)}.detail h2{font:700 clamp(30px,5vw,54px)/1 var(--tk-font-display);margin:10px 0}.detail p{color:var(--tk-muted);margin:14px 0 0;max-width:650px}.tags,.export-toolbar{display:flex;flex-wrap:wrap;gap:7px}.tag{border:1px solid var(--tk-border);border-radius:99px;padding:3px 9px;font-size:12px;background:var(--tk-bg)}.facts{border-left:1px solid var(--tk-border);padding-left:22px;color:var(--tk-muted);font-size:13px}.facts a{color:var(--tk-accent)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.panel{border:1px solid var(--tk-border);border-radius:var(--tk-radius);padding:var(--panel-gap);background:var(--tk-bg)}.panel h3{font-size:13px;margin:0 0 13px}.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.swatch{border:0;padding:0;border-radius:calc(var(--tk-radius) * .8);background:transparent;color:var(--tk-text);text-align:left;cursor:pointer;overflow:hidden}.swatch:active,.copy:active{transform:scale(.97)}.type-row{padding:12px 0;border-bottom:1px solid var(--tk-border)}.type-row:last-child{border:0}.type-row small{display:block;color:var(--tk-muted);font-family:var(--tk-font-sans);font-size:11px}.space-row{margin:11px 0;font-size:12px}.space-demo{display:flex;align-items:center;width:max-content;max-width:100%;margin-top:6px}.space-block,.radius-box{width:20px;height:20px;flex:none;border-radius:4px;background:var(--tk-accent)}.radius-samples{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.radius-sample{display:grid;gap:6px;font-size:11px;color:var(--tk-muted)}.radius-box{width:58px;height:42px}.shadow-box{min-height:112px;padding:18px;background:color-mix(in srgb,var(--tk-surface) 72%,var(--tk-bg));display:grid;place-items:center;font-size:11px;color:var(--tk-muted)}.shadow-sample{width:100%;min-height:58px;padding:12px;border-radius:var(--tk-radius);background:var(--tk-bg);display:grid;place-items:center;text-align:center;overflow-wrap:anywhere}.code{padding:var(--panel-gap);overflow:hidden}.export-toolbar{align-items:center;justify-content:flex-end;gap:12px}.copy{border:1px solid var(--tk-border);background:var(--tk-bg);color:var(--tk-text);border-radius:7px;padding:7px 10px;cursor:pointer;font-size:12px}.copy:disabled{cursor:wait;opacity:.58}.export-help{margin:0;color:var(--tk-muted);font-size:13px}.code-frame{margin-top:16px;border:1px solid var(--tk-border);border-radius:calc(var(--tk-radius) * .8);overflow:hidden;background:color-mix(in srgb,var(--tk-surface) 72%,var(--tk-bg))}.code pre{margin:0;padding:16px;max-height:420px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.empty{border:1px dashed var(--tk-border);padding:28px;border-radius:var(--tk-radius);color:var(--tk-muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--tk-text);color:var(--tk-bg);padding:8px 12px;border-radius:99px;font-size:13px;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(hover:hover) and (pointer:fine){.site-card:hover{transform:translateY(-2px);border-color:var(--tk-accent)}}@media(max-width:760px){:root{--section-gap:36px;--title-gap:12px;--panel-gap:16px}.top,.detail{display:block}.status{margin-top:16px}.facts{border-left:0;border-top:1px solid var(--tk-border);padding:14px 0 0;margin-top:20px}.grid{grid-template-columns:1fr}.shell{padding:24px 16px 56px}}@media(max-width:560px){.copy{margin-left:auto}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:160ms!important;transition-delay:0ms!important}.site-card:active,.swatch:active,.copy:active{transform:none}.toast,.toast.show{transform:translate(-50%,0)}}

    .swatch-accent b{padding:0;background:transparent}
    .swatches{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}.swatch-sample{min-height:112px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;border-radius:calc(var(--tk-radius) * .8);overflow:hidden}.sample-label{font-size:11px;font-weight:700}.sample-value{font-size:11px;opacity:.74}.sample-canvas{gap:8px}.sample-surface{min-height:48px;padding:9px;border-radius:calc(var(--tk-radius) * .5);display:grid;align-content:space-between}.sample-lines{display:grid;gap:5px}.sample-lines i{display:block;height:5px;border-radius:99px;background:currentColor;opacity:.72}.sample-lines i:last-child{width:58%;opacity:.42}.sample-text{justify-content:center;gap:8px}.sample-text p{margin:0;font-size:13px;line-height:1.45}.sample-text small{font-size:11px;opacity:.72}.sample-muted{justify-content:center;gap:7px}.sample-muted b{font-size:14px}.sample-muted small{font-size:11px}.sample-action{justify-content:center;align-items:flex-start;gap:10px}.sample-action b{padding:8px 10px;border-radius:var(--tk-btn-radius);background:currentColor;font-size:12px}.sample-frame{background:var(--tk-bg);padding:8px}.sample-frame-inner{height:96px;padding:10px;border:2px solid currentColor;border-radius:calc(var(--tk-radius) * .45);display:flex;flex-direction:column;justify-content:space-between}.sample-frame-inner span{font-size:11px}.export-toolbar{justify-content:flex-end}.copy:disabled{cursor:wait;opacity:.58}.export-help{margin:0}.code pre{overflow:auto}.swatch-missing{min-height:112px}
    .shadow-box[hidden]{display:none}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.site-card{min-width:0;position:relative}.site-media{aspect-ratio:16/10;position:relative;overflow:hidden;background:var(--tk-surface)}.site-media img{width:100%;height:100%;display:block;object-fit:cover;object-position:top;transition:transform 220ms var(--ease-out)}.card-overlay{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:end;gap:4px;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.36) 52%,transparent 76%);color:#fff;opacity:0;transform:translateY(6px);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);pointer-events:none}.card-overlay strong{font-size:16px;line-height:1.2}.card-overlay span,.card-overlay small{font-size:12px;line-height:1.35}.card-overlay small{opacity:.78}.site-card:focus-visible{outline:2px solid var(--tk-accent);outline-offset:3px}html{scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) var(--tk-bg)}html::-webkit-scrollbar{width:10px}html::-webkit-scrollbar-track{background:var(--tk-bg)}html::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border:2px solid var(--tk-bg);border-radius:999px}html::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover)}@media(hover:hover) and (pointer:fine){.site-card:hover .card-overlay,.site-card:focus-visible .card-overlay{opacity:1;transform:translateY(0)}.site-card:hover .site-media img,.site-card:focus-visible .site-media img{transform:scale(1.02)}}@media(hover:none),(pointer:coarse){.card-overlay{opacity:1;transform:none}}@media(max-width:900px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}@media(max-width:600px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card-overlay{padding:10px;gap:3px}.card-overlay strong{font-size:13px}.card-overlay span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-overlay small{display:none}}@media(prefers-reduced-motion:reduce){.site-media img,.card-overlay{transition:none}.card-overlay{transform:none}}@media(forced-colors:active){html{scrollbar-color:auto}}

<body>
  <main class="shell">
    <header class="top"><div><div class="eyebrow">Personal style archive</div><h1>网站风格收藏</h1><p>收藏喜欢的网站风格，积累审美，也为下一次设计找到方向。</p></div><div class="status" id="status">正在载入收藏…</div></header>
    <section class="section"><div class="section-title"><h2>我的收藏</h2><span id="count"></span></div><div class="gallery" id="gallery" aria-label="收藏的网站风格"></div></section>
    <section class="section" id="detail" hidden>
      <div class="detail"><div><div class="eyebrow" id="current-style"></div><h2 id="current-name"></h2><div class="tags" id="tags"></div><p id="thesis"></p></div><div class="facts" id="facts"></div></div>
      <div class="section-title section"><h2>核心色彩</h2><span>点击样例 · 复制色值</span></div><div class="swatches" id="swatches"></div>
      <div class="section-title section"><h2>字体与节奏</h2><span id="font-stack"></span></div><div class="grid"><article class="panel"><h3>字阶</h3><div id="type-scale"></div></article><article class="panel"><h3>间距 · <span id="density"></span></h3><div id="spaces"></div></article><article class="panel"><h3 id="shape-title">圆角 / 阴影</h3><div class="radius-samples" id="radii"></div><div class="shadow-box" id="shadow">轻量层次</div></article></div>
      <div class="section-title section"><h2>风格文档</h2><span>完整记录 · 直接交给 AI</span></div><article class="panel code"><p class="export-help">汇总风格方向、视觉参数与 CSS，可直接作为设计或编码提示词。</p><div class="export-toolbar"><button class="copy" id="copy-code" disabled><span class="copy-label" aria-live="polite">加载文档中…</span></button></div><div class="code-frame" id="code"><pre id="code-content">正在加载 STYLE-GUIDE.md…</pre></div></article>
    </section>
  </main><div class="toast" id="toast" role="status"></div>
  <script>
    (() => {
      const $ = s => document.querySelector(s), state = {sites:[],current:null,guide:'',guideState:'loading',selectionVersion:0,copyTimer:0,copyFeedback:false};
      const defaults = {'--tk-bg':'#fff','--tk-surface':'#f6f9fc','--tk-text':'#0a2540','--tk-muted':'#425466','--tk-accent':'#635bff','--tk-border':'#e6ebf1','--tk-font-sans':'Inter, sans-serif','--tk-font-display':'Inter, sans-serif','--tk-radius':'10px','--tk-shadow':'0 2px 8px rgba(10,37,64,.08)','--tk-space':'8px','--tk-btn-radius':'8px','--tk-btn-border':'transparent','--tk-btn-shadow':'0 2px 8px rgba(10,37,64,.08)'};
      const esc = v => String(v ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const toast = text => { const n=$('#toast'); n.textContent=text; n.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>n.classList.remove('show'),1500); };
      async function copy(text){ try { await navigator.clipboard.writeText(text); return true; } catch { const a=document.createElement('textarea'); a.value=text; a.style.cssText='position:fixed;opacity:0'; document.body.append(a); a.select(); const copied=document.execCommand('copy'); a.remove(); return copied; } }
      const colorRoles = {background:['背景 bg','背景','bg','background'],surface:['surface','分隔面 surface','表面','分隔面'],text:['text','正文 text','正文'],muted:['muted','次要 muted','次要','次要文字'],accent:['accent','强调 accent','强调','强调色'],border:['border','边框 border','边框','描边']};
      const role = (colors, word) => (colors||[]).find(c => (colorRoles[word]||[word]).includes(c.role));
      const validColor = value => typeof value==='string' && CSS.supports('color',value.trim());
      function rgb(value){if(!validColor(value))return null; const probe=document.createElement('i'); probe.style.color=value; document.body.append(probe); const match=getComputedStyle(probe).color.match(/\d+(?:\.\d+)?/g); probe.remove(); return match?.length>=3?match.slice(0,3).map(Number):null;}
      const luminance = value => {const channels=rgb(value); if(!channels)return 0; return channels.map(channel=>{const n=channel/255;return n<=.03928?n/12.92:((n+.055)/1.055)**2.4;}).reduce((sum,n,_,all)=>sum+n*[.2126,.7152,.0722][_],0);};
      const contrast = (a,b) => {const [x,y]=[luminance(a),luminance(b)].sort((m,n)=>n-m);return (x+.05)/(y+.05);};
      const foregroundFor = (background,preferred) => validColor(preferred)&&contrast(preferred,background)>=4.5?preferred:contrast('#000',background)>=contrast('#fff',background)?'#000':'#fff';
      const scrollbarColor = (surface,accent,text) => [accent,text,'#000','#fff'].find(value=>validColor(value)&&contrast(value,surface)>=3)||'#000';
      const backgroundForText = (foreground,preferred) => validColor(preferred)&&contrast(foreground,preferred)>=4.5?preferred:contrast(foreground,'#fff')>=contrast(foreground,'#000')?'#fff':'#000';
      const safeUrl = value => { try { const url=new URL(value); return /^https?:$/.test(url.protocol)?url.href:'#'; } catch { return '#'; } };
      function renderCode(){const button=$('#copy-code'), label=$('#copy-code .copy-label'); button.disabled=state.guideState!=="ready"; if(state.guideState==="loading"){label.textContent="加载文档中…"; $('#code-content').textContent="正在加载 STYLE-GUIDE.md…"; return;} if(state.guideState==="error"){label.textContent="文档加载失败"; $('#code-content').textContent="无法加载 STYLE-GUIDE.md，请刷新后重试。"; return;} $('#code-content').textContent=state.guide; if(!state.copyFeedback) label.textContent="复制风格文档";}
      async function copyExport(){if(state.guideState!=="ready"||!await copy(state.guide))return; clearTimeout(state.copyTimer); state.copyFeedback=true; $('#copy-code .copy-label').textContent='已复制'; state.copyTimer=setTimeout(()=>{state.copyFeedback=false;renderCode();},1200);}
      function renderGallery(){ $('#gallery').innerHTML=state.sites.map(s=>`<button class="site-card" data-id="${esc(s.id)}" aria-pressed="${String(s.id===state.current?.id)}" aria-label="${esc(`${s.name}，${[s.style?.primary,s.style?.secondary].filter(Boolean).join('，')||'未判定'}，查看风格详情`)}"><span class="site-media"><img src="sites/${encodeURIComponent(s.id)}/screenshot.png" loading="lazy" decoding="async" alt=""><span class="card-overlay"><strong>${esc(s.name)}</strong><span>${esc([s.style?.primary,s.style?.secondary].filter(Boolean).join(' · ')||'未判定')}</span><small>${esc((s.style?.descriptors||[]).slice(0,5).join(' · '))}${s.warnings?.length?' · 部分抽取':''}</small></span></span></button>`).join(''); }
      function updateGallerySelection(){ $('#gallery').querySelectorAll('.site-card').forEach(card=>card.setAttribute('aria-pressed',String(card.dataset.id===state.current?.id))); }
      let detailAnimation;
      function animateDetail(){const detail=$('.detail'); detailAnimation?.cancel(); const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; detailAnimation=detail.animate(reduce?[{opacity:.78},{opacity:1}]:[{opacity:.78,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],{duration:reduce?120:220,easing:'cubic-bezier(.23,1,.32,1)',fill:'none'});}
      function colorPreview(name,key,color,textColor,backgroundColor,surfaceColor){const value=esc(color), canvas=esc(surfaceColor||backgroundColor||'#fff'), surface=esc(surfaceColor||backgroundForText(color,backgroundColor)), fg=esc(foregroundFor(canvas,textColor)), onCanvas=esc(foregroundFor(canvas,textColor)); if(key==='background')return `<button class="swatch" data-copy="${value}" aria-label="复制背景色 ${value}"><span class="swatch-sample sample-canvas" style="background:${value};color:${onCanvas}"><span class="sample-label">页面背景</span><span class="sample-surface" style="background:${surface};color:${fg}"><span class="sample-lines"><i></i><i></i></span><small>${value}</small></span></span></button>`; if(key==='surface')return `<button class="swatch" data-copy="${value}" aria-label="复制表面色 ${value}"><span class="swatch-sample sample-canvas" style="background:${canvas};color:${fg}"><span class="sample-label">内容表面</span><span class="sample-surface" style="background:${value}"><span class="sample-lines"><i></i><i></i></span><small>${value}</small></span></span></button>`; if(key==='text')return `<button class="swatch" data-copy="${value}" aria-label="复制正文字色 ${value}"><span class="swatch-sample sample-text" style="background:${canvas};color:${value}"><span class="sample-label">正文段落</span><p>用清晰的信息层级，让阅读自然发生。</p><span class="sample-value">${value}</span></span></button>`; if(key==='muted')return `<button class="swatch" data-copy="${value}" aria-label="复制次要文字色 ${value}"><span class="swatch-sample sample-muted" style="background:${canvas};color:${value}"><span class="sample-label">辅助信息</span><b>设计记录</b><small>2026 · 风格观察 · ${value}</small></span></button>`; if(key==='accent'){const buttonText=esc(foregroundFor(color)); return `<button class="swatch" data-copy="${value}" aria-label="复制强调色 ${value}"><span class="swatch-sample sample-action" style="background:${canvas};color:${fg}"><span class="sample-label">强调操作</span><b style="background:${value};color:${buttonText}">保存这份风格</b><span class="sample-value">${value}</span></span></button>`;} return `<button class="swatch" data-copy="${value}" aria-label="复制边框色 ${value}"><span class="swatch-sample sample-frame" style="color:${value}"><span class="sample-frame-inner"><span>内容边界</span><span>${value}</span></span></span></button>`;}
      function renderDetail(animate=false){const s=state.current,t=s.tokens||{},ty=t.typography||{},ra=t.radius||{},sp=t.space||{},sh=t.shadow||{}, colors=t.colors||[], textColor=role(colors,'text')?.hex, backgroundColor=role(colors,'background')?.hex, surfaceColor=role(colors,'surface')?.hex; $('#detail').hidden=false; $('#current-name').textContent=s.name; $('#current-style').textContent=[s.style?.primary,s.style?.secondary].filter(Boolean).join(' · ')||'未判定'; $('#thesis').textContent=s.style?.thesis||'此记录未提供风格说明。'; $('#tags').innerHTML=(s.style?.descriptors||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join(''); $('#facts').innerHTML=`采集于 ${esc(s.extractedAt||'未知')}<br><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noreferrer">访问原站 ↗</a>${s.warnings?.length?'<br><br><strong>部分抽取</strong><br>'+s.warnings.map(esc).join('<br>'):''}`; const semantic=[['背景','background'],['表面','surface'],['正文','text'],['次要文字','muted'],['强调色','accent'],['边框','border']].map(([name,key])=>{const value=role(colors,key)?.hex;return validColor(value)?colorPreview(name,key,value,textColor,backgroundColor,surfaceColor):`<div class="swatch-missing" aria-label="${name}未采集"><b>${name}</b><small>未采集</small></div>`;}).join(''); $('#swatches').innerHTML=semantic; $('#font-stack').textContent=ty.fontSans?`主要字体 · ${ty.fontSans}`:'未采集字体栈'; $('#type-scale').innerHTML=(ty.scale||[]).map(x=>`<div class="type-row" style="font-size:${Number(x.px)||16}px;font-weight:${Number(x.w)||400};line-height:${Number(x.lh)||1.4}">${esc(x.role||'文字')}<small>${Number(x.px)||16}px / ${Number(x.w)||400} / ${Number(x.lh)||1.4}</small></div>`).join('')||'<span class="empty">暂无字阶数据。</span>'; $('#density').textContent=sp.density||'未采集'; const spaces=[...new Set((sp.scale||[]).map(Number).filter(value=>Number.isFinite(value)&&value>=0))].sort((a,b)=>a-b); $('#spaces').innerHTML=spaces.map(value=>`<div class="space-row"><span>${value}px</span><span class="space-demo" style="gap:${value}px"><i class="space-block"></i><i class="space-block"></i></span></div>`).join('')||'<span class="empty">暂无间距数据。</span>'; const radii=[['小',ra.sm],['中',ra.md],['大',ra.lg]].filter(([,value])=>Number.isFinite(Number(value))&&Number(value)>=0); $('#radii').innerHTML=radii.map(([name,value])=>`<span class="radius-sample"><i class="radius-box" style="border-radius:${Number(value)}px"></i><small>${name} · ${Number(value)}px</small></span>`).join('')||'<span class="empty">暂无圆角数据。</span>'; const shadow=typeof sh.md==='string'&&sh.md.trim()?sh.md:''; const hasShadow=Boolean(shadow)&&!/^none$/i.test(shadow); const shadowBox=$('#shadow'); $('#shape-title').textContent=hasShadow?'圆角 / 阴影':'圆角'; if(!hasShadow){shadowBox.hidden=true;shadowBox.innerHTML='';shadowBox.style.boxShadow='';}else{shadowBox.hidden=false;shadowBox.innerHTML=`<div class="shadow-sample"><span>阴影样例</span><small>${esc(shadow)}</small></div>`;shadowBox.querySelector('.shadow-sample').style.boxShadow=shadow;} renderCode(); if(animate)animateDetail(); }
      async function select(id){const s=state.sites.find(x=>x.id===id);if(!s||s.id===state.current?.id)return; const version=++state.selectionVersion; clearTimeout(state.copyTimer); state.copyFeedback=false; state.current=s; state.guide=''; state.guideState='loading'; const theme={...defaults,...(s.theme||{})}; Object.entries(theme).forEach(([k,v])=>document.documentElement.style.setProperty(k,v)); const thumb=scrollbarColor(theme['--tk-surface']||theme['--tk-bg'],theme['--tk-accent'],theme['--tk-text']); document.documentElement.style.setProperty('--scroll-thumb',thumb); document.documentElement.style.setProperty('--scroll-thumb-hover',foregroundFor(thumb)); updateGallerySelection(); renderDetail(true); try{const res=await fetch(`sites/${encodeURIComponent(s.id)}/STYLE-GUIDE.md`); if(!res.ok)throw new Error(`HTTP ${res.status}`); const guideText=await res.text(); if(!guideText.trim())throw new Error('empty guide'); if(version!==state.selectionVersion)return; state.guide=guideText; state.guideState='ready'; renderCode();}catch{if(version!==state.selectionVersion)return; state.guide=''; state.guideState='error'; renderCode();} }
      document.addEventListener('click',async e=>{const card=e.target.closest('.site-card'), swatch=e.target.closest('[data-copy]'); if(card)return select(card.dataset.id); if(swatch){const value=swatch.dataset.copy;if(await copy(value))toast(`色值 ${value} 已复制`);return;} if(e.target.closest('#copy-code'))return copyExport();});
      async function boot(){try{const idx=await (await fetch('sites/index.json')).json(); const loaded=await Promise.all(idx.map(async i=>{try{return await (await fetch(`sites/${encodeURIComponent(i.id)}/site.json`)).json();}catch{return {...i,warnings:['站点记录无法加载']};}})); state.sites=loaded; $('#count').textContent=`${loaded.length} 个收藏`; if(!loaded.length)throw new Error('索引中没有记录'); renderGallery(); await select(loaded[0].id); $('#status').textContent='本地保存 · 随时复用';}catch(err){$('#status').textContent='加载失败'; $('#gallery').innerHTML=`<div class="empty">暂无可载入的收藏。请通过静态 HTTP 服务器打开此页面，而不是 file://。<br><small>${esc(err.message)}</small></div>`;}}
      boot();
    })();
  </script>
</body>
