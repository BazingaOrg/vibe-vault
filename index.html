<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vibe Vault：本地保存可迁移的网站视觉风格与设计方向。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css?v=20260812-plain-language">
  <title>Vibe Vault · 风格收藏册</title>
</head>
<body>
  <main class="shell">
    <header class="top"><div><div class="eyebrow">个人风格档案</div><h1>Vibe Vault</h1><p>收藏喜欢的网站风格，积累审美，也为下一次设计找到方向。</p></div><div class="status" id="status">正在打开收藏册…</div></header>
    <section class="section"><div class="section-title"><h2>我的收藏</h2><span id="count"></span></div><div class="filters" id="filters" hidden><div class="chips" id="chips" aria-label="按主风格筛选"></div><label class="search"><span class="sr-only">搜索收藏</span><input id="search" type="search" placeholder="搜索名称、风格或描述词"></label></div><div class="gallery" id="gallery" aria-label="收藏的网站风格" aria-busy="true"></div></section>
    <section class="section" id="detail" hidden>
      <div class="detail">
        <figure class="detail-cover"><img id="current-shot" alt="" decoding="async"></figure>
        <div class="detail-copy"><div class="eyebrow" id="current-style"></div><h2 id="current-name" tabindex="-1"></h2><div class="tags" id="tags"></div><p id="thesis"></p><p class="capture-boundary">这里只保存颜色、字体和视觉特征，不包含原站布局、组件、图片或图表数据。</p></div>
        <div class="facts" id="facts"></div>
      </div>
      <div class="section-title section"><h2>风格预览</h2><span>用提取的颜色和字体生成</span></div>
      <article class="specimen" id="specimen" aria-label="所选网站的风格预览">
        <div class="specimen-kicker">组合效果</div><h3 id="specimen-title">风格标题</h3><p>这段示例用来看看提取出的字体、颜色、边框与形态放在一起是什么感觉。</p>
        <div class="specimen-rule"></div><div class="specimen-actions"><button type="button">示例按钮</button><span>辅助文字</span></div>
      </article>
      <div class="section-title section"><h2>颜色</h2><span>点击色块复制色值</span></div><div class="swatches" id="swatches"></div>
      <div class="section-title section"><h2>字体与间距</h2><span id="font-stack"></span></div><div class="grid"><article class="panel"><h3>字号</h3><div id="type-scale"></div></article><article class="panel"><h3>间距 · <span id="density"></span></h3><div id="spaces"></div></article><article class="panel"><h3 id="shape-title">圆角与阴影</h3><div class="radius-samples" id="radii"></div><div class="shadow-box" id="shadow">阴影效果</div></article></div>
      <div class="section-title section"><h2>风格特征</h2><span>决定整体气质的设计特征</span></div><div class="grammar-grid" id="grammar"></div>
      <div class="section-title section"><h2>开发参数</h2><button class="copy copy--primary" id="copy-code" disabled><span class="copy-label" aria-live="polite">加载中…</span></button></div>
      <details class="panel code"><summary>查看全部开发参数</summary><p class="export-help">给设计或代码工具使用，日常浏览可以忽略。</p><div class="code-frame"><pre id="code-content">正在加载开发参数…</pre></div></details>
    </section>
  </main><div class="toast" id="toast" role="status"></div>
  <script type="module" src="assets/app.js?v=20260812-plain-language"></script>
</body>
</html>
