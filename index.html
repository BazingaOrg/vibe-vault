<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vibe Vault：收藏网站的视觉气质，为下一次设计找到方向。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css?v=20261030-scrollbar-accent">
  <title>Vibe Vault · 风格收藏册</title>
</head>
<body>
  <main class="shell">
    <header class="top">
      <a class="brand" href="./" aria-label="Vibe Vault 首页">Vibe Vault<span>风格收藏册</span></a>
    </header>
    <section class="feature" id="detail" aria-label="当前风格" hidden>
      <div class="feature-heading"><span>风格来自</span><span id="current-style"></span></div>
      <div class="feature-grid">
        <div class="detail-copy">
          <h1 id="current-name" tabindex="-1"></h1>
          <div class="tags" id="tags"></div>
          <p id="thesis"></p>
          <div id="detail-content">
            <div class="export-actions">
              <button class="action action--primary" id="copy-code" type="button" disabled><span class="copy-label">准备风格包…</span><span aria-hidden="true">↗</span></button>
              <button class="action action--quiet" id="download-guide" type="button" disabled>下载风格包 <span aria-hidden="true">↓</span></button>
              <button class="action" id="retry-guide" data-retry-guide type="button" hidden>重试文档</button>
            </div>
            <p class="guide-feedback" id="guide-feedback" role="status"></p>
            <p class="reuse-note">带走视觉气质，开始你的设计。</p>
          </div>
        </div>
        <figure class="reference">
          <a class="reference-image" id="current-image-link" target="_blank" rel="noreferrer" aria-label="打开原站截图大图"><img id="current-shot" alt="" decoding="async"><span class="media-fallback" id="current-shot-fallback" hidden>截图暂不可用</span></a>
          <figcaption><span>原站参考 <span aria-hidden="true">↗</span></span><a id="source-link" target="_blank" rel="noreferrer">访问原站 ↗</a></figcaption>
        </figure>
      </div>
      <div id="detail-error" role="status"></div>
      <p class="record-status" id="record-status" role="status"></p>
    </section>
    <section class="collection" id="collection" aria-labelledby="gallery-heading">
      <div class="collection-heading"><div><span class="eyebrow">THE COLLECTION</span><h2 id="gallery-heading" tabindex="-1">继续翻阅。</h2></div><span id="count" role="status"></span></div>
      <div class="filters" id="filters" hidden>
        <label class="search"><span class="sr-only">搜索收藏</span><input id="search" type="search" placeholder="寻找一种气质…" autocomplete="off"></label>
        <details class="filter-menu"><summary>按风格筛选</summary><div class="chips" id="chips" aria-label="按风格筛选"></div></details>
      </div>
      <div class="gallery" id="gallery" aria-label="收藏的网站风格" aria-busy="true"></div>
    </section>
    <footer class="page-footer"><span>不同的风格，同一本收藏册。</span><span id="status">正在打开收藏册…</span></footer>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="assets/app.js?v=20261030-gallery-recovery"></script>
</body>
</html>
